<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Lost and Found</title>
    <link rel="stylesheet" href="style.css?v=20260425">
</head>
<body class="auth-page register-page">
    <div class="container">
        <h2>Create Account</h2>
        <p style="text-align: center; color: #666; margin-bottom: 20px;">Join the Lost and Found Information System.</p>
        
        <form action="../backend/register.php" method="POST">
            
            <div class="form-group">
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name" placeholder="e.g. John Doe" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="example@mail.com" required>
            </div>
            
            <div class="form-group">
                <label for="student_id">Student / Staff ID</label>
                <input type="text" id="student_id" name="student_id" placeholder="e.g. 2021001" required>
            </div>
            
            <div class="form-group">
                <label for="role">Your Role</label>
                <select id="role" name="role">
                    <option value="student">Student</option>
                    <option value="staff">Staff</option>
                    <option value="academician">Academician</option>
                    <option value="visitor">Visitor</option>
                </select>
            </div>

            <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

            <div class="form-group">
                <label for="security_question">Select a Security Question</label>
                <select id="security_question" name="security_question" required>
                    <option value="" disabled selected>Please choose a question...</option>
                    <option value="nickname">What was your childhood nickname?</option>
                    <option value="first_pet">What was the name of your first pet?</option>
                    <option value="mother_maiden">What is your mother's maiden name?</option>
                    <option value="favorite_color">What is your favorite color?</option>
                </select>
            </div>

            <div class="form-group">
                <label for="security_answer">Security Question Answer</label>
                <input 
                    type="text" 
                    id="security_answer" 
                    name="security_answer" 
                    placeholder="Type your answer here" 
                    required
                >
                <small style="color: #888; font-size: 0.8rem;">* This answer will be required if you forget your password.</small>
            </div>

            <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
            
            <div class="form-group">
                <label for="password">Password (Min. 8 characters)</label>
                <input type="password" id="password" name="password" placeholder="******" minlength="8" required>
            </div>
            
            <button type="submit">Create Account</button>
        </form>
        
        <p class="footer-text">Already have an account? <a href="login.html">Login</a></p>
    </div>
</body>
</html>
