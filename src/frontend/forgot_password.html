<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Lost and Found</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Forgot Password</h2>
        <p class="helper-text">Enter your Email to request a password reset.</p>

        <form action="#" method="POST">
            <div class="form-group">
                <label for="identifier">Email</label>
                <input
                    type="text"
                    id="identifier"
                    name="identifier"
                    placeholder="Enter Email"
                    required
                    oninvalid="this.setCustomValidity('Please enter your Student ID or Email Address.')"
                    oninput="this.setCustomValidity('')"
                >
            </div>

            <button type="submit">Send Reset Link</button>
        </form>

        <p class="footer-text"><a href="login.html">Back to Login</a></p>
    </div>
</body>
</html>
