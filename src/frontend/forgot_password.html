<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Lost and Found</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="forgot_password.css">
</head>
<body>
    <div class="container">
        <h2>FORGOT PASSWORD</h2>
        <p class="helper-text">Please enter your email to retrieve your password.</p>

        <form action="#" method="POST">
            <div class="row">
                <div class="form-group">
                    <label for="email">User Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter Email"
                        required
                    >
                </div>
                <button id="searchBtn" class="inline-btn" type="button">Search</button>
            </div>

            <div class="form-group mt-16">
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name" placeholder="Auto filled" readonly>
            </div>

            <div id="securityBlock" class="hidden">
                <div class="form-group">
                    <label for="security_question">Security Question</label>
                    <select id="security_question" name="security_question" disabled>
                        <option value="" selected>—</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="security_answer">Answer</label>
                    <input type="text" id="security_answer" name="security_answer" placeholder="Type your answer" autocomplete="off">
                </div>

                <button id="retrieveBtn" class="btn-green" type="button">Retrieve</button>
            </div>

            <div id="updateBlock" class="hidden">
                <div class="form-group mt-10">
                    <label for="new_password">New Password</label>
                    <input type="password" id="new_password" name="new_password" placeholder="Min. 8 characters" minlength="8" autocomplete="new-password">
                </div>
                <button id="updateBtn" class="btn-orange" type="button">Update Password</button>
            </div>

            <div id="statusText" class="status-text"></div>
        </form>

        <p class="footer-text"><a href="login.html">Back</a></p>
    </div>

    <script src="js/forgot_password.js"></script>
</body>
</html>
